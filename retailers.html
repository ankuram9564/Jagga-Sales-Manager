<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Retailers — Jagga Sales Manager</title>
<meta name="theme-color" content="#0b5ed7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="tb-left">
      <button class="tb-back" onclick="location.href='dashboard.html'"><span class="material-symbols-outlined">arrow_back</span></button>
      <h1>Retailers</h1>
    </div>
    <div class="tb-actions">
      <button class="tb-icon-btn" onclick="App.toggleTheme()"><span class="material-symbols-outlined">dark_mode</span></button>
    </div>
  </div>

  <div class="page">
    <div class="search-bar">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="rSearch" placeholder="Search retailer, shop, mobile…" oninput="refreshList()">
    </div>

    <div class="chip-row mt-12" id="wholesalerChips"></div>

    <div class="list mt-16" id="retailerList"></div>
  </div>

  <button class="fab" onclick="RetailerModule.openForm()"><span class="material-symbols-outlined">add</span></button>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Add / Edit Retailer Sheet -->
<div class="overlay" id="retailerSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="retailerFormTitle">Add Retailer</h2>
      <button class="sheet-close" onclick="App.closeSheet('retailerSheet')"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="retailerForm" onsubmit="RetailerModule.save(event)">
      <div class="form-group">
        <label>Linked Wholesaler <span class="req">*</span></label>
        <select name="wholesalerId" required></select>
      </div>
      <div class="form-group">
        <label>Retailer Name <span class="req">*</span></label>
        <input type="text" name="retailerName" placeholder="Retailer's full name" required>
      </div>
      <div class="form-group">
        <label>Shop Name</label>
        <input type="text" name="shopName" placeholder="e.g. New Footwear Corner">
      </div>
      <div class="form-group">
        <label>Owner Name</label>
        <input type="text" name="ownerName" placeholder="If different from retailer name">
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" name="mobile" placeholder="10-digit mobile">
        </div>
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="tel" name="whatsapp" placeholder="If different">
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" placeholder="Shop address"></textarea>
      </div>
      <div class="form-group">
        <label>Google Maps Link</label>
        <input type="url" name="mapLink" placeholder="Paste Google Maps link">
      </div>
      <div class="form-group">
        <label>Birthday</label>
        <input type="date" name="birthday">
      </div>
      <div class="form-group">
        <label>Shop Photo</label>
        <div class="upload-box" id="rShopBox"><span class="material-symbols-outlined">photo_camera</span>Tap to upload shop photo</div>
        <input type="file" id="rShopInput" accept="image/*" capture="environment" class="hidden">
        <div id="rShopPreview"></div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" placeholder="Any remarks about this retailer"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save Retailer</button>
    </form>
  </div>
</div>

<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script>
  App.init('retailers');

  function refreshList() {
    const q = App.qs('rSearch').value;
    const activeChip = document.querySelector('.chip.active');
    RetailerModule.renderList('retailerList', { query: q, wholesalerId: activeChip ? activeChip.dataset.wid : '' });
  }

  function onRetailerDataChanged() { renderChips(); refreshList(); }

  function renderChips() {
    const wholesalers = DB.getWholesalers();
    const mount = App.qs('wholesalerChips');
    if (!wholesalers.length) { mount.innerHTML = ''; return; }
    mount.innerHTML = `<div class="chip active" data-wid="" onclick="selectChip(this)">All</div>` +
      wholesalers.map(w => `<div class="chip" data-wid="${w.id}" onclick="selectChip(this)">${w.firmName}</div>`).join('');
  }

  function selectChip(el) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    refreshList();
  }

  renderChips();
  refreshList();
</script>
</body>
</html>
