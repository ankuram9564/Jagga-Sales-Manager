<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orders — Jagga Sales Manager</title>
<meta name="theme-color" content="#0b5ed7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="tb-left">
      <button class="tb-back" onclick="location.href='dashboard.html'"><span class="material-symbols-outlined">arrow_back</span></button>
      <h1>Orders</h1>
    </div>
    <div class="tb-actions">
      <button class="tb-icon-btn" onclick="App.toggleTheme()"><span class="material-symbols-outlined">dark_mode</span></button>
    </div>
  </div>

  <div class="page">
    <div class="search-bar">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="oSearch" placeholder="Search art no., colour, firm, retailer…" oninput="refreshList()">
    </div>

    <div class="flex justify-between items-center mt-16">
      <div class="section-title first" style="margin:0;">Order History</div>
      <span class="text-sm text-muted" id="orderSummary"></span>
    </div>

    <div class="list mt-12" id="orderList"></div>
  </div>

  <button class="fab" onclick="location.href='order-form.html'"><span class="material-symbols-outlined">add</span></button>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script src="js/orders.js"></script>
<script>
  App.init('orders');

  function refreshList() {
    const q = App.qs('oSearch').value;
    OrdersModule.renderList('orderList', { query: q });
    const orders = DB.getOrders();
    const total = orders.reduce((s, o) => s + (o.value || 0), 0);
    App.qs('orderSummary').textContent = `${orders.length} orders · ${App.formatMoney(total)}`;
  }

  refreshList();
</script>
</body>
</html>
