<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wholesaler Profile — Jagga Sales Manager</title>
<meta name="theme-color" content="#0b5ed7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="tb-left">
      <button class="tb-back" onclick="location.href='wholesalers.html'"><span class="material-symbols-outlined">arrow_back</span></button>
      <h1>Wholesaler Profile</h1>
    </div>
    <div class="tb-actions">
      <button class="tb-icon-btn" id="editWholesalerBtn"><span class="material-symbols-outlined">edit</span></button>
    </div>
  </div>

  <div class="page" id="wholesalerDetailMount"></div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Edit Wholesaler Sheet (reused) -->
<div class="overlay" id="wholesalerSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="wholesalerFormTitle">Edit Wholesaler</h2>
      <button class="sheet-close" onclick="App.closeSheet('wholesalerSheet')"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="wholesalerForm" onsubmit="WholesalerModule.save(event)">
      <div class="form-group">
        <label>Firm Name <span class="req">*</span></label>
        <input type="text" name="firmName" required>
      </div>
      <div class="form-group">
        <label>Owner Name</label>
        <input type="text" name="ownerName">
      </div>
      <div class="row-2">
        <div class="form-group"><label>Mobile Number</label><input type="tel" name="mobile"></div>
        <div class="form-group"><label>WhatsApp Number</label><input type="tel" name="whatsapp"></div>
      </div>
      <div class="row-2">
        <div class="form-group"><label>State</label><input type="text" name="state"></div>
        <div class="form-group"><label>City</label><input type="text" name="city"></div>
      </div>
      <div class="form-group"><label>Address</label><textarea name="address"></textarea></div>
      <div class="form-group"><label>Google Maps Link</label><input type="url" name="mapLink"></div>
      <div class="row-2">
        <div class="form-group"><label>Birthday</label><input type="date" name="birthday"></div>
        <div class="form-group"><label>Anniversary</label><input type="date" name="anniversary"></div>
      </div>
      <div class="form-group">
        <label>Shop Photo</label>
        <div class="upload-box" id="wShopBox"><span class="material-symbols-outlined">photo_camera</span>Tap to upload shop photo</div>
        <input type="file" id="wShopInput" accept="image/*" capture="environment" class="hidden">
        <div id="wShopPreview"></div>
      </div>
      <div class="form-group">
        <label>Visiting Card Photo</label>
        <div class="upload-box" id="wCardBox"><span class="material-symbols-outlined">badge</span>Tap to upload visiting card</div>
        <input type="file" id="wCardInput" accept="image/*" capture="environment" class="hidden">
        <div id="wCardPreview"></div>
      </div>
      <div class="form-group"><label>Notes</label><textarea name="notes"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Save Wholesaler</button>
    </form>
  </div>
</div>

<!-- Add Retailer Sheet (reused so we can add a retailer directly from this profile) -->
<div class="overlay" id="retailerSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="retailerFormTitle">Add Retailer</h2>
      <button class="sheet-close" onclick="App.closeSheet('retailerSheet')"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="retailerForm" onsubmit="RetailerModule.save(event)">
      <div class="form-group">
        <label>Linked Wholesaler <span class="req">*</span></label>
        <select name="wholesalerId" required></select>
      </div>
      <div class="form-group"><label>Retailer Name <span class="req">*</span></label><input type="text" name="retailerName" required></div>
      <div class="form-group"><label>Shop Name</label><input type="text" name="shopName"></div>
      <div class="form-group"><label>Owner Name</label><input type="text" name="ownerName"></div>
      <div class="row-2">
        <div class="form-group"><label>Mobile Number</label><input type="tel" name="mobile"></div>
        <div class="form-group"><label>WhatsApp Number</label><input type="tel" name="whatsapp"></div>
      </div>
      <div class="form-group"><label>Address</label><textarea name="address"></textarea></div>
      <div class="form-group"><label>Google Maps Link</label><input type="url" name="mapLink"></div>
      <div class="form-group"><label>Birthday</label><input type="date" name="birthday"></div>
      <div class="form-group">
        <label>Shop Photo</label>
        <div class="upload-box" id="rShopBox"><span class="material-symbols-outlined">photo_camera</span>Tap to upload shop photo</div>
        <input type="file" id="rShopInput" accept="image/*" capture="environment" class="hidden">
        <div id="rShopPreview"></div>
      </div>
      <div class="form-group"><label>Notes</label><textarea name="notes"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Save Retailer</button>
    </form>
  </div>
</div>

<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script>
  App.init('wholesalers');
  const params = new URLSearchParams(location.search);
  const wholesalerId = params.get('id');

  function onWholesalerDataChanged() { WholesalerModule.renderDetail(wholesalerId); }
  function onRetailerDataChanged() { WholesalerModule.renderDetail(wholesalerId); }

  App.qs('editWholesalerBtn').onclick = () => WholesalerModule.openForm(wholesalerId);

  WholesalerModule.renderDetail(wholesalerId);
</script>
</body>
</html>
