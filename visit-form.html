<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log Visit — Jagga Sales Manager</title>
<meta name="theme-color" content="#0b5ed7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="tb-left">
      <button class="tb-back" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
      <h1>Log Visit</h1>
    </div>
  </div>

  <div class="page">
    <form id="visitForm">
      <div class="form-group">
        <label>Wholesaler <span class="req">*</span></label>
        <select name="wholesalerId" required></select>
      </div>
      <div class="form-group">
        <label>Retailer</label>
        <select name="retailerId"></select>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Date</label>
          <input type="date" name="date">
        </div>
        <div class="form-group">
          <label>Visit Type</label>
          <select name="visitType">
            <option>Regular Visit</option>
            <option>New Introduction</option>
            <option>Follow-up</option>
            <option>Order Collection</option>
            <option>Complaint / Support</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option>Visited</option>
          <option>Closed</option>
          <option>No Order</option>
        </select>
      </div>
      <div class="form-group">
        <label>Meeting Notes</label>
        <textarea name="notes" placeholder="What was discussed…"></textarea>
      </div>
      <div class="form-group">
        <label>Next Follow-up Date</label>
        <input type="date" name="nextFollowup">
      </div>
      <div class="form-group">
        <label>Shop Photo</label>
        <div class="upload-box" id="vShopBox"><span class="material-symbols-outlined">photo_camera</span>Tap to capture a photo</div>
        <input type="file" id="vShopInput" accept="image/*" capture="environment" class="hidden">
        <div id="vShopPreview"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save Visit</button>
    </form>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script src="js/orders.js"></script>
<script>
  App.init('tour');
  VisitModule.initForm();
</script>
</body>
</html>
