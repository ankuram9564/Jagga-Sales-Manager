<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wholesalers — Jagga Sales Manager</title>
<meta name="theme-color" content="#0b5ed7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="tb-left">
      <button class="tb-back" onclick="location.href='dashboard.html'"><span class="material-symbols-outlined">arrow_back</span></button>
      <h1>Wholesalers</h1>
    </div>
    <div class="tb-actions">
      <button class="tb-icon-btn" onclick="App.toggleTheme()"><span class="material-symbols-outlined">dark_mode</span></button>
    </div>
  </div>

  <div class="page">
    <div class="search-bar">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="wSearch" placeholder="Search firm, owner, city, mobile…" oninput="refreshList()">
    </div>

    <div class="chip-row mt-12" id="stateChips"></div>

    <div class="list mt-16" id="wholesalerList"></div>
  </div>

  <button class="fab" onclick="WholesalerModule.openForm()"><span class="material-symbols-outlined">add</span></button>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Add / Edit Wholesaler Sheet -->
<div class="overlay" id="wholesalerSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="wholesalerFormTitle">Add Wholesaler</h2>
      <button class="sheet-close" onclick="App.closeSheet('wholesalerSheet')"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="wholesalerForm" onsubmit="WholesalerModule.save(event)">
      <div class="form-group">
        <label>Firm Name <span class="req">*</span></label>
        <input type="text" name="firmName" placeholder="e.g. Sharma Footwear House" required>
      </div>
      <div class="form-group">
        <label>Owner Name</label>
        <input type="text" name="ownerName" placeholder="Owner's full name">
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" name="mobile" placeholder="10-digit mobile">
        </div>
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="tel" name="whatsapp" placeholder="If different">
        </div>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>State</label>
          <input type="text" name="state" placeholder="e.g. Haryana" list="stateList">
          <datalist id="stateList"></datalist>
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" name="city" placeholder="e.g. Bahadurgarh">
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" placeholder="Shop / firm address"></textarea>
      </div>
      <div class="form-group">
        <label>Google Maps Link</label>
        <input type="url" name="mapLink" placeholder="Paste Google Maps link">
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Birthday</label>
          <input type="date" name="birthday">
        </div>
        <div class="form-group">
          <label>Anniversary</label>
          <input type="date" name="anniversary">
        </div>
      </div>
      <div class="form-group">
        <label>Shop Photo</label>
        <div class="upload-box" id="wShopBox"><span class="material-symbols-outlined">photo_camera</span>Tap to upload shop photo</div>
        <input type="file" id="wShopInput" accept="image/*" capture="environment" class="hidden">
        <div id="wShopPreview"></div>
      </div>
      <div class="form-group">
        <label>Visiting Card Photo</label>
        <div class="upload-box" id="wCardBox"><span class="material-symbols-outlined">badge</span>Tap to upload visiting card</div>
        <input type="file" id="wCardInput" accept="image/*" capture="environment" class="hidden">
        <div id="wCardPreview"></div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" placeholder="Any remarks about this wholesaler"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save Wholesaler</button>
    </form>
  </div>
</div>

<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script>
  App.init('wholesalers');

  function refreshList() {
    const q = App.qs('wSearch').value;
    const activeChip = document.querySelector('.chip.active');
    WholesalerModule.renderList('wholesalerList', { query: q, state: activeChip ? activeChip.dataset.state : '' });
  }

  function onWholesalerDataChanged() { renderChips(); refreshList(); }

  function renderChips() {
    const states = DB.getStates();
    const mount = App.qs('stateChips');
    App.qs('stateList').innerHTML = states.map(s => `<option value="${s}">`).join('');
    if (!states.length) { mount.innerHTML = ''; return; }
    mount.innerHTML = `<div class="chip active" data-state="" onclick="selectChip(this)">All</div>` +
      states.map(s => `<div class="chip" data-state="${s}" onclick="selectChip(this)">${s}</div>`).join('');
  }

  function selectChip(el) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    refreshList();
  }

  renderChips();
  refreshList();
</script>
</body>
</html>
